<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MacrosTrack - Seguimiento de Macros y Nutrición</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="description" content="PWA autocontenida de seguimiento nutricional de macronutrientes, recetas y métricas multiusuario" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MacrosTrack" />

  <!-- Manifest & Icons -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/views.css" />
</head>
<body>
  <div id="appShell">
    <!-- Navegación: Barra Inferior en Móvil / Sidebar Lateral en Landscape y Desktop -->
    <nav class="app-nav" id="appNav" aria-label="Navegación principal">
      <button class="nav-item-btn active" data-view-target="diary" aria-label="Diario de Macros">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Diario</span>
      </button>

      <button class="nav-item-btn" data-view-target="recipes" aria-label="Recetas y Platillos">
        <span class="nav-icon">🍲</span>
        <span class="nav-label">Recetas</span>
      </button>

      <button class="nav-item-btn" data-view-target="shared" aria-label="Comparativa Comunitaria">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Comunidad</span>
      </button>

      <button class="nav-item-btn" data-view-target="metrics" aria-label="Resumen y Métricas">
        <span class="nav-icon">📈</span>
        <span class="nav-label">Métricas</span>
      </button>

      <button class="nav-item-btn" data-view-target="profile" aria-label="Perfiles y Ajustes">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Perfil</span>
      </button>
    </nav>

    <!-- Contenedor del Cuerpo de la App -->
    <div class="app-body-wrap">
      <!-- Cabecera Superior -->
      <header class="app-header">
        <div class="brand-group">
          <img src="./icons/icon.svg" alt="MacrosTrack Logo" class="brand-logo-img" />
          <h1 class="brand-title">MacrosTrack</h1>
        </div>

        <!-- Botón de Usuario Activo en Cabecera -->
        <button class="header-user-btn" id="globalUserBtn" title="Cambiar usuario activo">
          <span class="header-user-avatar" id="globalUserAvatar">🥑</span>
          <span class="header-user-name" id="globalUserName">Cargando...</span>
          <span style="font-size: 0.7rem; color: #94a3b8;">▾</span>
        </button>
      </header>

      <!-- Contenedor Dinámico de la Vista -->
      <main class="app-main" id="appMainContent">
        <div class="empty-state" style="padding-top: 60px;">
          <div class="loading-spinner" style="font-size: 1.1rem; color: #38bdf8; font-weight: 600;">
            Cargando MacrosTrack...
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Main JavaScript App Module -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
