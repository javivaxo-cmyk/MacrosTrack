<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="proteinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="carbsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="fatsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="kcalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Macro Track Ring (Kcal Emerald) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="26" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#kcalGrad)" stroke-width="26"
    stroke-linecap="round" stroke-dasharray="1130" stroke-dashoffset="320" filter="url(#glow)" />

  <!-- Middle Macro Ring (Protein Blue) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1e293b" stroke-width="20" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#proteinGrad)" stroke-width="20"
    stroke-linecap="round" stroke-dasharray="880" stroke-dashoffset="280" />

  <!-- Inner Macro Ring (Carbs Amber) -->
  <circle cx="256" cy="256" r="105" fill="none" stroke="#1e293b" stroke-width="16" />
  <circle cx="256" cy="256" r="105" fill="none" stroke="url(#carbsGrad)" stroke-width="16"
    stroke-linecap="round" stroke-dasharray="660" stroke-dashoffset="240" />

  <!-- Central Fitness / Nutrition Flame/Leaf Icon -->
  <path d="M 256 180 C 230 215 210 245 210 275 C 210 305 230 328 256 328 C 282 328 302 305 302 275 C 302 245 282 215 256 180 Z"
        fill="url(#fatsGrad)" filter="url(#glow)" />
  <path d="M 256 225 C 242 248 232 268 232 285 C 232 300 242 312 256 312 C 270 312 280 300 280 285 C 280 268 270 248 256 225 Z"
        fill="#fef08a" />
</svg>
